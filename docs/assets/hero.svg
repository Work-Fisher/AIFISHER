    <radialGradient id="glow"><stop stop-color="#204b41" stop-opacity=".7"/><stop offset="1" stop-color="#0d1417" stop-opacity="0"/></radialGradient>
    <linearGradient id="line"><stop stop-color="#526c63"/><stop offset="1" stop-color="#bce8ab"/></linearGradient>
  </defs>
  <rect width="1280" height="460" rx="24" fill="#0d1417"/>
  <rect width="1280" height="460" rx="24" fill="url(#dots)"/>
  <ellipse cx="980" cy="240" rx="370" ry="310" fill="url(#glow)"/>
  <path d="M58 68H1222" stroke="#33423d"/>
