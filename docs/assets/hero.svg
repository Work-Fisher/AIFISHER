    <text x="684" y="178" fill="#eef3e6" font-size="22">灵感与素材</text>
    <text x="684" y="311" fill="#91ab9c" font-size="11" letter-spacing="2">02 / CONNECT</text>
    <text x="684" y="352" fill="#eef3e6" font-size="22">模型与工作流</text>
    <text x="938" y="217" fill="#3c6149" font-size="11" letter-spacing="2">03 / CREATE</text>
