    <text x="62" y="296" fill="#a8b9b1" font-size="20">让灵感连成作品。</text>
    <rect x="60" y="345" width="397" height="40" rx="20" fill="#172621" stroke="#3f5649"/>
    <text x="258" y="371" text-anchor="middle" fill="#c5d8c6" font-size="13" letter-spacing="1">IMAGE / VIDEO / AGENT / WORKFLOW</text>
